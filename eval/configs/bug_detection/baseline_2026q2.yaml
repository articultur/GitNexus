# Bug Detection Baseline Config (Stage A)
# Fixed inputs for repeatable runs.

name: bug-detection-baseline-2026q2
subset: lite
split: test
slice: "0:15"

# Keep model/mode explicit for reproducibility.
model: deepseek-r1-free
mode: native_augment

# Repeatability gate: run same config N times and measure variance.
repeats: 3
workers: 1

# Acceptance thresholds from execution plan.
thresholds:
  max_patch_rate_std: 0.05
  max_avg_cost_std: 0.05

output:
  root_dir: results
  run_prefix: bugdet_2026q2
